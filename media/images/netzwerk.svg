<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, Segoe UI, sans-serif">
  <style>
    .k { fill: #1f2433; stroke: #6d8cff; stroke-width: 1.5; }
    .t { fill: #e8ebf4; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s { fill: #98a0b8; font-size: 12px; text-anchor: middle; }
    .l { fill: none; stroke: #6d8cff; stroke-width: 2; stroke-dasharray: 7 6; animation: fluss 1.4s linear infinite; }
    .w { stroke: #f0b429; }
    @keyframes fluss { to { stroke-dashoffset: -13; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; } }
  </style>

  <path class="l" d="M160 190 H230"/>
  <path class="l" d="M380 190 H450"/>
  <path class="l" d="M600 190 C640 190 640 40 700 40"/>
  <path class="l" d="M600 190 C650 190 650 130 700 130"/>
  <path class="l" d="M600 190 C650 190 650 220 700 220"/>
  <path class="l w" d="M380 215 C430 330 620 340 700 310"/>

  <rect class="k" x="10" y="150" width="150" height="80" rx="12"/>
  <text class="t" x="85" y="186">Internet</text>
